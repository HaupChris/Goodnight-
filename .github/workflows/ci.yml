name: CI - Build & API Tests

on:
  push:
    branches: [main, master, 'claude/*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: cd client && npm install

      - name: Install server dependencies
        run: cd server && npm install

      - name: Build client
        run: cd client && npm run build

      - name: Build server
        run: cd server && npm run build

      - name: TypeScript type check passed
        run: echo "✅ TypeScript compilation successful"

  api-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        run: cd server && npm install

      - name: Build server
        run: cd server && npm run build

      - name: Run API health checks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cd server
          # Start server in background
          node dist/index.js &
          SERVER_PID=$!

          # Wait for server to start
          sleep 5

          # Test health endpoint
          echo "Testing /api/health..."
          curl -f http://localhost:3001/api/health || exit 1

          # Test APIs if keys are provided
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$ELEVENLABS_API_KEY" ]; then
            echo ""
            echo "Testing /api/health/apis..."
            RESULT=$(curl -s http://localhost:3001/api/health/apis)
            echo "$RESULT" | jq .

            # Check if all APIs are ok
            STATUS=$(echo "$RESULT" | jq -r '.status')
            if [ "$STATUS" != "ok" ]; then
              echo "❌ API tests failed!"
              kill $SERVER_PID 2>/dev/null
              exit 1
            fi

            echo ""
            echo "Testing /api/health/voices..."
            VOICES=$(curl -s http://localhost:3001/api/health/voices)
            echo "$VOICES" | jq .

            VOICE_STATUS=$(echo "$VOICES" | jq -r '.status')
            if [ "$VOICE_STATUS" != "ok" ]; then
              echo "⚠️ Some voices are not available"
            fi
          else
            echo "⚠️ API keys not configured - skipping API tests"
          fi

          # Cleanup
          kill $SERVER_PID 2>/dev/null
          echo ""
          echo "✅ All tests passed!"

  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t goodnight-stories:test .

      - name: Docker build successful
        run: echo "✅ Docker image built successfully"
